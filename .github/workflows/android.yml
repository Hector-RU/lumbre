name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902' # Command-line Tools 22.0
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports-and-apks
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
  devices:
    # Verify integration PRs as well as release tags and manual runs.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '37.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902' # Command-line Tools 22.0
          packages: platform-tools
      - name: Use pinned tools when the emulator action prepends latest
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/15859902/bin/avdmanager"
          if [ -e "$ANDROID_HOME/cmdline-tools/latest" ] || [ -L "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/runner-preinstalled"
          fi
          ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build device APKs before starting the emulator
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          # API 37 previously could not install the APK with the default data partition.
          disk-size: 6G
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: |
            mkdir -p test-artifacts/ci
            cp "$ANDROID_AVD_HOME/test.ini" test-artifacts/ci/avd.ini
            grep -Fx 'target=android-${{ matrix.api }}' "$ANDROID_AVD_HOME/test.ini"
          # Motion regressions verify the real resize snapshot and page-turn animations.
          disable-animations: false
          script: bash scripts/verify_android_device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            test-artifacts/ci/
